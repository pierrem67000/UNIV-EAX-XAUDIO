; XAudio Universal 3.0 — restart the game after changing settings.
[Wrapper]
; Default engine for all relays. Relative paths are relative to each relay.
; This target must be an XAudio Universal compatible core, never a system audio DLL.
RealDllPath=xaudiouniv.dll

[Features]
DirectSound=1
DirectSound8=1
DirectSound3D=1
OpenAL=1
OpenALEFX=1
EAX=1
EAX1=1
EAX2=1
EAX3=1
EAX4=1
; Partial EAX5: four sends and slot occlusion, without acoustic MacroFX/PurePath/Voice.
EAX5=1
WaveOut=1
PlaySound=1

[XAudio2]
; XAudio2 is mandatory. There is no WASAPI/OpenAL output backend selector.
SampleRate=48000
; 1, 2, 4, 6 or 8. Use 2 for headphones/HRTF.
Channels=2
PeriodFrames=512
QueueBuffers=4
