# Optional OpenAL Soft configuration. Rename to alsoft.ini beside the game EXE.
# Keep commented settings to retain automatic device/speaker configuration.
[general]
# Enable both lines for explicit headphone / HRTF rendering:
#stereo-mode = headphones
#stereo-encoding = hrtf
# Increase buffering only if the output device still underruns:
#period_size = 1024
#periods = 4
